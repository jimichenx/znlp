name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新构建取消进行中的旧构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 带内置 Gradle 缓存；编译即门禁（-Xlint:all -Werror）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 与 CI 无关的资源均已排除：
      # - benchmark / train / performance：耗时基准与训练脚本
      # - heavy：依赖本机 data/ 大语料或全量词典/模型，内存占用大
      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test/'
          if-no-files-found: ignore
